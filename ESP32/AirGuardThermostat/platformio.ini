; M5Stack Dial - HVAC Smart Thermostat
; PlatformIO Project Configuration
; ─────────────────────────────────────────────────────────────────────────────

[env:m5stack-dial]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Upload & Monitor ────────────────────────────────────────────────────────
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default

; ── Board overrides matching M5Stack Dial hardware ──────────────────────────
board_build.mcu              = esp32s3
board_build.f_cpu            = 240000000L
board_build.f_flash          = 80000000L
board_build.flash_mode       = qio
board_build.partitions       = default_8MB.csv
board_build.arduino.memory_type = qio_opi   ; enables OPI PSRAM

; USB-CDC (required for serial monitor over the USB-C port)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; ── Libraries ───────────────────────────────────────────────────────────────
; Versions pinned exactly — M5Unified 0.1.14 requires M5GFX 0.1.16.
; Using ^ (caret) lets PlatformIO pull M5GFX 0.1.17 which broke the API.
lib_deps =
    m5stack/M5Dial    @ 1.0.2
    m5stack/M5GFX     @ 0.1.16
    m5stack/M5Unified @ 0.1.14
    https://github.com/mobizt/Firebase-ESP-Client
    ; Uncomment when you add physical sensors:
    ; adafruit/Adafruit SHT31 Library @ ^2.2.2
    ; adafruit/Adafruit BusIO         @ ^1.14.1
    ; sciosense/ScioSense_ENS160      @ ^1.0.3
